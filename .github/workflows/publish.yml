name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # publish action pushes the built site to gh-pages

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Python + Jupyter are only needed so Quarto can read the .ipynb files.
      # FEniCS is never installed or executed in CI — pages render from the
      # notebooks' stored outputs (execute.freeze: true).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jupyter nbformat nbclient

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
