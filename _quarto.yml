project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "methods/*.qmd"
  resources:
    - "CNAME"
    - "notebooks/"        # raw notebooks copied to the site so they're downloadable

# Never execute on the build server. Pages render from stored notebook outputs,
# so FEniCS is never installed or run in CI.
execute:
  freeze: true

website:
  title: "Rob Furze"
  description: "Multiscale computational tribology — friction & lubrication in artificial hip joints."
  site-url: "https://rfurze.co.uk"       
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: methods/index.qmd
        text: Methods & code
    right:
      - icon: github
        href: https://github.com/RFurze
        aria-label: GitHub
  page-footer:
    border: true
    left: "© 2026 Rob Furze"
    center: "Code [MIT](licence.qmd) · Text & figures [CC BY 4.0](licence.qmd)"
    right: "Built with [Quarto](https://quarto.org)."

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-location: right
    code-copy: true
    code-overflow: wrap
    grid:
      body-width: 820px
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
