project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "methods/*.qmd"
  resources:
    - "CNAME"
    - "notebooks/"        # raw notebooks copied to the site so they're downloadable
    - "og-card.png"       # social preview image, referenced by absolute URL
    - "apple-touch-icon.png"
    - "cv/"               # CV PDF, served for download

# Never execute on the build server. Pages render from stored notebook outputs,
# so FEniCS is never installed or run in CI.
execute:
  freeze: true

website:
  title: "Robin Furze"
  description: "Multiscale computational tribology — friction & lubrication in artificial hip joints."
  site-url: "https://rfurze.co.uk"
  favicon: favicon.png

  # Link previews. Without these, sharing the site anywhere renders a bare URL.
  # Individual pages inherit these unless they set their own in front matter.
  # (image dimensions are set explicitly in include-in-header below — Quarto 1.6
  # accepts image-width/image-height here but does not emit the meta tags.)
  open-graph:
    locale: en_GB
    image: https://rfurze.co.uk/og-card.png
    image-alt: "Robin Furze — multiscale computational tribology, University of Leeds"
  twitter-card:
    card-style: summary_large_image
    image: https://rfurze.co.uk/og-card.png
    image-alt: "Robin Furze — multiscale computational tribology, University of Leeds"

  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: methods/index.qmd
        text: Methods & code
      - href: cv.qmd
        text: CV
    right:
      - icon: github
        href: https://github.com/RFurze
        aria-label: GitHub
  page-footer:
    border: true
    left: "© 2026 Robin Furze"
    center:
      - text: "Code MIT · Text & figures CC BY 4.0"
        href: licence.qmd
    right: "Built with [Quarto](https://quarto.org)."

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-location: right
    code-copy: true
    code-overflow: wrap
    grid:
      body-width: 820px
    include-in-header:
      - text: |
          <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
          <meta name="theme-color" content="#0E7C86">
          <meta property="og:image:width" content="1200">
          <meta property="og:image:height" content="630">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
